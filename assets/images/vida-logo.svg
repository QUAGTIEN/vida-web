<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Logo VIDA</title>
  <desc id="description">Logo nền xanh lá tươi với chữ VIDA đỏ đậm, viền trắng và bóng nhẹ</desc>
  <defs>
    <filter id="letter-shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="5" dy="8" stdDeviation="3" flood-color="#083D20" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="#22B85A"/>
  <text
    x="256"
    y="304"
    fill="#D5232A"
    stroke="#F7F7F2"
    stroke-width="12"
    paint-order="stroke fill"
    filter="url(#letter-shadow)"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="142"
    font-weight="900"
    font-style="italic"
    letter-spacing="-2"
    text-anchor="middle"
  >VIDA</text>
</svg>
